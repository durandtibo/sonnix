# Type checking workflow.
# Validates type annotations: pyright is blocking, ty is advisory.
# Helps catch type-related bugs before runtime.

name: Type Checking
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  type-checking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0
        with:
          install-args: "--groups dev,docs"

      # pyright is the gate: it is stable, so a new release does not turn CI red by itself.
      - name: Check types with pyright
        run: |
          inv types.check

      # ty is pre-1.0, so it is advisory: a failure is reported but does not fail the workflow.
      - name: Check types with ty (advisory)
        continue-on-error: true
        run: |
          uv run ty check
