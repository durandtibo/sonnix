# Code formatting and linting workflow.
# Checks the formatting and the quality of the Python, shell, YAML, TOML and Makefile files.
# Ensures code follows project style guidelines.

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      # The Markdown files are not formatted here: the existing documentation does not
      # pass prettier and markdownlint yet.
      - name: Format
        run: |
          make format-yaml format-makefile format-shell format-toml
      - name: Check for changes
        run: |
          git diff --exit-code

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Lint
        run: |
          make lint-yaml lint-makefile lint-shell lint-actions

  python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1

      - name: Check python formatting
        run: |
          inv format.check-python

      - name: Lint python scripts
        run: |
          inv lint.check-python
