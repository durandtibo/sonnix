# Cyclic imports check.
# Imports every sonnix subpackage in isolation to catch circular-import
# regressions that only surface once a submodule is imported directly.

name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@269cae0b38051f39b2cfb10230687ba2b8093424 # ratchet:durandtibo/setup-venv-uv-action@v0.2.0

      - name: check sonnix
        run: |
          python -c "import sonnix"

      - name: check sonnix.functional
        run: |
          python -c "from sonnix import functional"
          python -c "from sonnix.functional import activation"
          python -c "from sonnix.functional import loss"

      - name: check sonnix.modules
        run: |
          python -c "from sonnix import modules"
          python -c "from sonnix.modules import activation"
          python -c "from sonnix.modules import fusion"
          python -c "from sonnix.modules import loss"
          python -c "from sonnix.modules import numerical"

      - name: check sonnix.utils
        run: |
          python -c "from sonnix import utils"
