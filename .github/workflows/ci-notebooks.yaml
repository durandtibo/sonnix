# Notebook testing workflow.
# Executes the notebooks to ensure they run without errors, so they cannot rot.

name: Notebooks
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  notebooks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          install-args: "--groups dev,notebook"

      # Execute every notebook (the outputs are discarded)
      - name: Execute the notebooks
        run: |
          jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP/notebooks" notebooks/*.ipynb
