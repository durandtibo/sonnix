# Configuration of markdownlint (https://github.com/DavidAnson/markdownlint).
default: true

# Tables and code blocks cannot be rewrapped easily, so they are not checked.
MD013:
  line_length: 80
  tables: false
  code_blocks: false

# The API reference pages are mkdocs pages: the index uses HTML badges and
# the other rules below conflict with mkdocs / mkdocstrings.
MD033: false # inline HTML (badges in docs/docs/index.md)
MD046: false # indented blocks are mkdocs admonitions
MD051: false # anchors are generated by mkdocstrings (#sonnix.modules.X)
MD041: false # docs/docs/index.md only includes README.md (snippet)
